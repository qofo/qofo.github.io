# Build served by the phone itself: hugo --environment phone
baseURL = "https://daringly-marrow-penny.ngrok-free.dev/"

# content-phone/ holds the pages that only make sense on the phone: the live dashboard.
# Declaring content mounts replaces the default one, so content/ is listed again here.
[[module.mounts]]
  source = "content"
  target = "content"
[[module.mounts]]
  source = "content-phone"
  target = "content"

# Menus do not merge across configuration directories: the whole main menu is repeated
# here so that the phone copy keeps the shared entries next to its own dashboard link.
[[menus.main]]
  name = "보관함"
  url = "/archives/"
  weight = 10

[[menus.main]]
  name = "태그"
  url = "/tags/"
  weight = 20

[[menus.main]]
  name = "소개"
  url = "/about/"
  weight = 30

[[menus.main]]
  name = "📊 대시보드"
  url = "/dashboard/"
  weight = 40

[params.footer]
  text = "이 사본은 [서랍 속 폰](/series/스마트폰으로-서버-만들기/)이 직접 보내고 있다. 같은 글이 [GitHub Pages](https://qofo.github.io/)에도 있다. · 글 [qofo/qofo.github.io](https://github.com/qofo/qofo.github.io) (CC BY 4.0) · 서버 코드 [qofo/phone-homeserver](https://github.com/qofo/phone-homeserver) (MIT)"

[params]
  origin = "phone"
  # Same origin, so no ngrok header and no preflight
  metricsURL = "/api/metrics"
  pollHome = 10
  pollDashboard = 3
