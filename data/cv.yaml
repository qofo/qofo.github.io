  - title: 논문
    entries:
      - title: 객체 단위 통제로 본 CLIP 부정 이해의 병목 분석과 저계수 이중선형 변환
        titleEn: Analyzing CLIP's Negation Bottleneck under Object-Level Control with a Low-Rank Bilinear Transform
        authors: "**이준서** (제1저자), 조현석"
        sub: 제7회 한국인공지능학술대회 · 게재 승인, 구두 발표
        date: "2026"
        links:
          - name: 코드
            url: https://github.com/qofo/lowrank-bilinear-negation
        items:
          - CLIP이 부정이 들어간 질의로 이미지를 검색할 때 실패하는 문제를, 같은 사진에서 객체 하나만 지운 이미지 쌍과 긍정·부정 캡션 쌍을 맞추는 2×2 판정 문제로 정의함
          - 실패 원인을 표현, 모달리티 정렬, 유사도 함수의 세 단계로 나누어 차례로 검증함. 선형 프로빙으로 두 인코더 모두에 부정·존재 정보가 담겨 있음을 확인하고, 직교 회전으로 두 모달리티의 방향을 완전히 정렬해도 정확도가 무작위 수준을 넘지 못함을 보임
          - 코사인 유사도를 저계수 이중선형 변환으로 바꿔, 인코더를 고정한 채 적은 파라미터로 부정 판정 정확도를 높임

