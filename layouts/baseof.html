<!DOCTYPE html>
<html lang="ko">
<head>
  {{- partial "head.html" . }}
</head>
<body>
  {{- partial "header.html" . }}
  <div class="container">
    {{- block "main" . }}{{ end }}
  </div>
  {{- partial "footer.html" . }}
  {{- $js := resources.Get "js/site.js" | minify | fingerprint }}
  <script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
  {{- block "scripts" . }}{{ end }}
</body>
</html>
