{{- $js := resources.Get "js/telemetry.js" | minify | fingerprint }}
{{- $interval := cond (eq .Layout "dashboard") site.Params.pollDashboard site.Params.pollHome }}
<script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" data-url="{{ site.Params.metricsURL }}" data-interval="{{ $interval }}" defer></script>
